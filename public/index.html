<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Green Machines WC 2026 🏆</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Abril+Fatface&family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#fdf6e3;--surface:#fff;--surface2:#fef9ee;--border:#e8dfc8;--border2:#d4c8a8;
  --text:#1a1a2e;--muted:#8a7f6b;--green:#2d6a4f;--green-light:#d8f3dc;--green-mid:#74c69d;
  --red:#c1121f;--red-light:#ffe0e0;--gold:#f4a500;--gold-light:#fff3cd;
  --radius:12px;--radius-lg:18px;--shadow:0 2px 12px rgba(0,0,0,.08);--shadow-lg:0 8px 32px rgba(0,0,0,.12);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:'Nunito',sans-serif;font-size:14px;min-height:100vh}
.sync-bar{background:var(--green);color:rgba(255,255,255,.9);font-size:11px;font-weight:800;text-align:center;padding:5px;letter-spacing:.06em;text-transform:uppercase;display:flex;align-items:center;justify-content:center;gap:6px}
.sync-dot{width:7px;height:7px;border-radius:50%;background:#a8ff78;animation:pulse 1.5s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.sync-bar.offline{background:#888}
.last-updated{background:var(--surface2);border-bottom:1px solid var(--border);padding:4px 20px;font-size:10px;color:var(--muted);font-weight:700;text-align:right;letter-spacing:.04em}
.hero{background:var(--green);padding:28px 20px 22px;position:relative;overflow:hidden}
.hero::before{content:'';position:absolute;inset:0;background-image:repeating-linear-gradient(90deg,rgba(255,255,255,.03) 0,rgba(255,255,255,.03) 60px,transparent 60px,transparent 120px)}
.hero-inner{position:relative;max-width:960px;margin:0 auto;display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}
.hero-title{font-family:'Abril Fatface',serif;font-size:clamp(32px,6vw,68px);color:#fff;line-height:.95}
.hero-title .year{color:var(--gold)}
.hero-sub{font-size:12px;color:rgba(255,255,255,.65);margin-top:8px;font-weight:600}
.hero-sub b{color:rgba(255,255,255,.9)}
.hero-actions{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.hero-stats{display:flex;gap:12px;flex-wrap:wrap}
.stat-block{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.15);border-radius:var(--radius);padding:10px 16px;text-align:center;min-width:70px}
.stat-num{font-family:'Abril Fatface',serif;font-size:28px;color:var(--gold);line-height:1}
.stat-label{font-size:9px;color:rgba(255,255,255,.6);text-transform:uppercase;letter-spacing:.1em;margin-top:2px;font-weight:700}
.admin-bar{background:#1a1a2e;padding:8px 20px;display:flex;align-items:center;gap:12px}
.admin-toggle{display:flex;align-items:center;gap:6px;cursor:pointer;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);border-radius:50px;padding:4px 12px;color:rgba(255,255,255,.7);font-family:'Nunito',sans-serif;font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.08em;transition:all .15s}
.admin-toggle:hover{background:rgba(255,255,255,.15);color:#fff}
.admin-toggle.active{background:var(--gold);border-color:var(--gold);color:#000}
.admin-hint{font-size:11px;color:rgba(255,255,255,.4)}
.btn{padding:9px 18px;border-radius:50px;border:2px solid transparent;font-family:'Nunito',sans-serif;font-size:12px;font-weight:800;cursor:pointer;letter-spacing:.04em;transition:all .15s;text-transform:uppercase}
.btn-white{background:#fff;color:var(--green);border-color:#fff}.btn-white:hover{background:var(--gold);color:#fff;border-color:var(--gold)}
.btn-green{background:var(--green);color:#fff;border-color:var(--green)}.btn-green:hover{background:#1b4332}
.btn-ghost{background:transparent;color:var(--muted);border-color:var(--border2)}.btn-ghost:hover{background:var(--surface2);color:var(--text)}
.btn-sm{padding:5px 12px;font-size:11px}
.btn-danger{background:transparent;color:var(--red);border-color:rgba(193,18,31,.3)}.btn-danger:hover{background:var(--red-light)}
.nav{background:var(--surface);border-bottom:2px solid var(--border);padding:0 20px;position:sticky;top:0;z-index:50;display:flex;overflow-x:auto;overflow-y:hidden;box-shadow:var(--shadow);-webkit-overflow-scrolling:touch;scrollbar-width:none}
.nav::-webkit-scrollbar{display:none}
.nav-tab{padding:13px 14px;font-size:11px;font-weight:800;color:var(--muted);cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-2px;white-space:nowrap;text-transform:uppercase;letter-spacing:.08em;transition:color .15s,border-color .15s}
.nav-tab:hover{color:var(--text)}
.nav-tab.active{color:var(--green);border-bottom-color:var(--green)}
.main{max-width:960px;margin:0 auto;padding:20px}
.panel{display:none}.panel.active{display:block}
.toggle-bar{display:flex;gap:0;background:var(--surface2);border:2px solid var(--border);border-radius:50px;padding:3px;margin-bottom:18px;width:fit-content}
.toggle-btn{padding:6px 18px;border-radius:50px;border:none;background:transparent;font-family:'Nunito',sans-serif;font-size:12px;font-weight:800;cursor:pointer;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;transition:all .15s}
.toggle-btn.active{background:var(--green);color:#fff;box-shadow:0 2px 8px rgba(45,106,79,.3)}
.filter-row{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px;align-items:center}
.filter-label{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.1em;font-weight:700;margin-right:4px}
.filter-btn{padding:5px 12px;border-radius:50px;border:2px solid var(--border2);background:transparent;color:var(--muted);font-size:11px;font-family:'Nunito',sans-serif;font-weight:800;cursor:pointer;text-transform:uppercase;letter-spacing:.06em;transition:all .15s}
.filter-btn:hover{color:var(--text);border-color:var(--green)}
.filter-btn.active{background:var(--green);color:#fff;border-color:var(--green)}
.groups-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.group-card{background:var(--surface);border:2px solid var(--border);border-radius:var(--radius-lg);overflow:hidden;box-shadow:var(--shadow);transition:border-color .2s,box-shadow .2s}
.group-card:hover{border-color:var(--green-mid)}
.group-card.done{border-color:var(--gold);box-shadow:0 2px 12px rgba(244,165,0,.15)}
.group-card-header{padding:9px 14px;background:var(--green);display:flex;justify-content:space-between;align-items:center}
.group-label{font-family:'Abril Fatface',serif;font-size:19px;color:#fff}
.complete-pill{font-size:10px;padding:2px 9px;background:var(--gold);color:#fff;border-radius:20px;font-weight:800;text-transform:uppercase}
.group-table{width:100%;border-collapse:collapse}
.group-table th{padding:5px 8px;text-align:center;font-size:10px;font-weight:800;color:var(--muted);letter-spacing:.1em;text-transform:uppercase;border-bottom:2px solid var(--border);background:var(--surface2)}
.group-table th:first-child{text-align:left}
.group-table td{padding:7px 8px;text-align:center;font-size:12px;color:var(--text);border-bottom:1px solid var(--border);font-weight:600}
.group-table tr:last-child td{border-bottom:none}
.group-table td:first-child{text-align:left}
.group-table tr.qualified td{background:var(--green-light)}
.group-table tr.eliminated td{opacity:.4}
.team-cell{display:flex;align-items:center;gap:5px;font-size:12px;font-weight:700}
.flag{display:inline-block;vertical-align:middle;flex-shrink:0}
.flag img{width:20px;height:15px;border-radius:2px;object-fit:cover;vertical-align:middle;display:inline-block}
.pts-cell{font-weight:900;color:var(--green);font-size:14px}
.q-badge{font-size:9px;padding:2px 5px;border-radius:4px;background:var(--green);color:#fff;font-weight:800;flex-shrink:0}
.out-badge{font-size:9px;padding:2px 5px;border-radius:4px;background:var(--red);color:#fff;font-weight:800;flex-shrink:0}
.matches-section{margin-bottom:24px}
.matches-group-title{font-family:'Abril Fatface',serif;font-size:22px;color:var(--green);margin-bottom:8px;padding-bottom:7px;border-bottom:2px solid var(--border)}
.matches-list{display:flex;flex-direction:column;gap:6px}
.match-row{background:var(--surface);border:2px solid var(--border);border-radius:var(--radius);padding:9px 14px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;box-shadow:var(--shadow)}
.match-row:hover{border-color:var(--green-mid)}
.match-row.has-score{border-left:4px solid var(--green)}
.match-home{text-align:right;display:flex;align-items:center;justify-content:flex-end;gap:5px;font-size:12px;font-weight:700}
.match-away{text-align:left;display:flex;align-items:center;gap:5px;font-size:12px;font-weight:700}
.score-center{display:flex;align-items:center;gap:4px;justify-content:center;min-width:90px}
.score-inp{width:36px;height:36px;background:var(--surface2);border:2px solid var(--border2);border-radius:8px;text-align:center;font-size:16px;font-family:'Nunito',sans-serif;font-weight:900;color:var(--green);transition:border-color .15s}
.score-inp:focus{outline:none;border-color:var(--green);background:var(--green-light)}
.score-static{font-family:'Abril Fatface',serif;font-size:22px;color:var(--green);min-width:36px;text-align:center}
.score-sep{font-size:18px;color:var(--muted);font-weight:900}
.qualified-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:24px}
@media(max-width:580px){.qualified-grid{grid-template-columns:1fr}}
.qualified-panel{background:var(--surface);border:2px solid var(--border);border-radius:var(--radius-lg);overflow:hidden;box-shadow:var(--shadow)}
.qp-header{padding:12px 16px;display:flex;align-items:center;gap:8px}
.qp-header.in-header{background:var(--green)}.qp-header.out-header{background:var(--red)}
.qp-title{font-family:'Abril Fatface',serif;font-size:20px;color:#fff}
.qp-emoji{font-size:22px}
.qp-count{margin-left:auto;background:rgba(255,255,255,.2);color:#fff;font-size:11px;font-weight:800;padding:3px 10px;border-radius:20px}
.qp-list{padding:6px 0}
.qp-item{display:flex;align-items:center;gap:8px;padding:7px 14px;border-bottom:1px solid var(--border);font-size:12px;font-weight:700}
.qp-item:last-child{border-bottom:none}
.group-tag{margin-left:auto;font-size:10px;font-weight:800;color:var(--muted);background:var(--surface2);border:1px solid var(--border2);border-radius:4px;padding:1px 6px;flex-shrink:0}
.rank-tag{font-size:10px;font-weight:800;padding:2px 6px;border-radius:4px;flex-shrink:0}
.rank-1st{background:var(--gold-light);color:#7a5a00}.rank-2nd{background:#eef2ff;color:#3730a3}
.progress-bar-wrap{background:var(--border);border-radius:50px;height:10px;overflow:hidden;margin:4px 0}
.progress-bar-fill{height:100%;background:linear-gradient(90deg,var(--green),var(--gold));border-radius:50px;transition:width .4s ease}
.waiting-state{text-align:center;padding:36px 20px;color:var(--muted)}
.waiting-gif{width:180px;border-radius:var(--radius);margin-bottom:14px;border:2px solid var(--border)}
.waiting-title{font-family:'Abril Fatface',serif;font-size:20px;color:var(--text);margin-bottom:6px}
.waiting-sub{font-size:13px;color:var(--muted);line-height:1.6}
.player-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px;margin-bottom:20px}
.player-card{background:var(--surface);border:2px solid var(--border);border-radius:var(--radius-lg);padding:12px 14px;box-shadow:var(--shadow)}
.player-card-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px}
.player-name-display{font-family:'Abril Fatface',serif;font-size:19px;color:var(--text);line-height:1}
.team-tag{display:flex;align-items:center;gap:5px;font-size:12px;font-weight:700;padding:4px 0;border-bottom:1px solid var(--border)}
.team-tag:last-child{border-bottom:none}
.tier-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.t1{background:var(--gold)}.t2{background:#4caf50}.t3{background:#2196f3}.t4{background:#e91e63}
.tier-legend{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.tier-badge{padding:4px 10px;border-radius:50px;font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.06em}
.tier-1{background:var(--gold-light);color:#7a5a00;border:2px solid var(--gold)}
.tier-2{background:#e8f5e9;color:#1b5e20;border:2px solid #4caf50}
.tier-3{background:#e3f2fd;color:#0d47a1;border:2px solid #2196f3}
.tier-4{background:#fce4ec;color:#880e4f;border:2px solid #e91e63}
.assign-table{width:100%;border-collapse:collapse;background:var(--surface);border:2px solid var(--border);border-radius:var(--radius-lg);overflow:hidden;box-shadow:var(--shadow);margin-bottom:20px}
.assign-table th{padding:8px 12px;background:var(--green);color:#fff;font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.08em;text-align:left}
.assign-table td{padding:7px 12px;border-bottom:1px solid var(--border);font-size:12px;vertical-align:middle}
.assign-table tr:last-child td{border-bottom:none}
.assign-table tr:hover td{background:var(--surface2)}
.assign-table select{width:100%;padding:5px 8px;border:2px solid var(--border2);border-radius:8px;background:var(--surface2);font-family:'Nunito',sans-serif;font-size:12px;font-weight:700;color:var(--text);cursor:pointer}
.assign-table select:focus{outline:none;border-color:var(--green)}
.ko-section{margin-bottom:28px}
.ko-round-title{font-family:'Abril Fatface',serif;font-size:22px;color:var(--green);margin-bottom:10px;padding-bottom:7px;border-bottom:2px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.ko-pts-badge{font-size:11px;font-weight:800;background:var(--gold-light);color:#7a5a00;border:1px solid var(--gold);border-radius:20px;padding:3px 10px;font-family:'Nunito',sans-serif}
.ko-matches{display:flex;flex-direction:column;gap:6px}
.ko-match{background:var(--surface);border:2px solid var(--border);border-radius:var(--radius);padding:9px 14px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;box-shadow:var(--shadow)}
.ko-match:hover{border-color:var(--green-mid)}
.ko-match.has-score{border-left:4px solid var(--green)}
.ko-match.winner-set{border-left:4px solid var(--gold)}
.ko-team{font-size:12px;font-weight:700;display:flex;align-items:center;gap:5px}
.ko-team.right{justify-content:flex-end;text-align:right}
.ko-team select{max-width:130px;padding:4px 6px;border:2px solid var(--border2);border-radius:8px;background:var(--surface2);font-family:'Nunito',sans-serif;font-size:11px;font-weight:700;color:var(--text);cursor:pointer}
.ko-team select:focus{outline:none;border-color:var(--green)}
.ko-tbd{color:var(--muted);font-style:italic;font-size:11px}
.leaderboard{background:var(--surface);border:2px solid var(--border);border-radius:var(--radius-lg);overflow:hidden;box-shadow:var(--shadow-lg)}
.lb-header{display:grid;grid-template-columns:44px 1fr auto;gap:8px;padding:9px 14px;background:var(--green);font-size:10px;font-weight:800;color:rgba(255,255,255,.7);text-transform:uppercase;letter-spacing:.1em}
.lb-row{display:grid;grid-template-columns:44px 1fr auto;gap:8px;padding:11px 14px;border-bottom:1px solid var(--border);align-items:center;transition:background .1s}
.lb-row:last-child{border-bottom:none}
.lb-row:hover{background:var(--surface2)}
.lb-row.rank-1{background:var(--gold-light)}.lb-row.rank-2{background:#f8f8f8}.lb-row.rank-3{background:#fff7f0}
.lb-rank{font-family:'Abril Fatface',serif;font-size:24px;color:var(--muted);text-align:center;line-height:1}
.lb-rank.r1{color:var(--gold)}.lb-rank.r2{color:#9ca3af}.lb-rank.r3{color:#cd7f32}
.lb-name-col{font-family:'Abril Fatface',serif;font-size:17px}
.lb-detail{font-size:11px;color:var(--muted);font-weight:600;margin-top:2px}
.lb-pts-col{text-align:right}
.lb-pts-main{font-family:'Abril Fatface',serif;font-size:22px;color:var(--green);line-height:1}
.lb-pts-sub{font-size:10px;color:var(--muted);margin-top:2px;font-weight:700}
.lb-breakdown{font-size:10px;color:var(--muted);margin-top:2px;font-weight:600}
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:200;align-items:center;justify-content:center}
.modal-overlay.open{display:flex}
.modal{background:var(--surface);border:2px solid var(--border);border-radius:var(--radius-lg);padding:24px;width:380px;max-width:92vw;box-shadow:0 40px 80px rgba(0,0,0,.25)}
.modal-title{font-family:'Abril Fatface',serif;font-size:26px;color:var(--green);margin-bottom:18px}
.modal label{display:block;font-size:11px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.1em;margin-bottom:5px}
.modal input[type=password]{width:100%;background:var(--surface2);border:2px solid var(--border2);border-radius:var(--radius);color:var(--text);font-family:'Nunito',sans-serif;font-size:13px;font-weight:600;padding:9px 12px;margin-bottom:12px}
.modal input:focus{outline:none;border-color:var(--green)}
.modal-footer{display:flex;gap:8px;justify-content:flex-end;margin-top:4px}
.readonly-banner{background:var(--gold-light);border:2px solid var(--gold);border-radius:var(--radius);padding:10px 16px;margin-bottom:16px;font-size:13px;font-weight:700;color:#7a5a00;display:flex;align-items:center;gap:8px}
.empty{padding:36px;text-align:center;color:var(--muted);font-size:13px;font-weight:600}
.empty-icon{font-size:36px;margin-bottom:10px}
/* LIVE TICKER */
.live-ticker{display:none;background:#c1121f;color:#fff;overflow:hidden}
.live-ticker.active{display:block}
.ticker-inner{display:flex;align-items:stretch}
.ticker-label{background:#8b0000;padding:8px 14px;font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.1em;white-space:nowrap;display:flex;align-items:center;gap:6px;flex-shrink:0}
.ticker-dot{width:8px;height:8px;border-radius:50%;background:#ff6b6b;animation:pulse 1s infinite;flex-shrink:0}
.ticker-scroll{overflow:hidden;flex:1;padding:8px 0}
.ticker-track{display:inline-flex;animation:ticker-move 35s linear infinite;white-space:nowrap}
.ticker-track:hover{animation-play-state:paused}
@keyframes ticker-move{0%{transform:translateX(0)}100%{transform:translateX(-50%)}}
.ticker-item{display:inline-flex;align-items:center;gap:8px;padding:0 28px;font-size:13px;font-weight:700;white-space:nowrap;border-right:1px solid rgba(255,255,255,.2)}
.ticker-score{font-family:'Abril Fatface',serif;font-size:17px}
.ticker-owners{font-size:10px;color:rgba(255,255,255,.7);font-weight:700}
/* BRACKET */
.bracket-wrap{overflow-x:auto;padding-bottom:12px}
.bracket{display:flex;gap:0;min-width:640px}
.bracket-round{flex:1;display:flex;flex-direction:column;padding:0 4px;min-width:130px}
.bracket-round-label{font-family:'Abril Fatface',serif;font-size:13px;color:var(--green);text-align:center;margin-bottom:8px;padding-bottom:5px;border-bottom:2px solid var(--border)}
.bracket-match{background:var(--surface);border:2px solid var(--border);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow)}
.bracket-match.live{border-color:var(--red)}
.bracket-team{display:flex;align-items:center;justify-content:space-between;padding:5px 8px;font-size:11px;font-weight:700;border-bottom:1px solid var(--border);gap:4px}
.bracket-team:last-child{border-bottom:none}
.bracket-team.winner{background:var(--green-light);color:var(--green)}
.bracket-team.tbd{color:var(--muted);font-style:italic;font-size:10px}
.bracket-team-left{display:flex;align-items:center;gap:3px;flex:1;min-width:0}
.bracket-team-left span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:10px}
.bracket-score{font-family:'Abril Fatface',serif;font-size:13px;color:var(--green);flex-shrink:0;min-width:14px;text-align:right}
.bracket-owner{font-size:9px;color:var(--muted);font-weight:800;white-space:nowrap;flex-shrink:0;background:var(--surface2);border-radius:3px;padding:1px 4px;border:1px solid var(--border)}
/* FORM DOTS */
.form-dots{display:inline-flex;gap:2px;margin-left:5px;vertical-align:middle}
.form-dot{width:7px;height:7px;border-radius:50%}
.form-w{background:#2d6a4f}.form-d{background:#f4a500}.form-l{background:#c1121f}.form-tbd{background:#d4c8a8}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-track{background:var(--bg)}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:3px}
@media(max-width:580px){
  .hero{padding:20px 14px 16px}.main{padding:14px}.nav{padding:0 14px}
  .hero-stats{gap:6px}
  .stat-block{padding:7px 10px;min-width:56px}
  .stat-num{font-size:20px}
  .stat-label{font-size:8px}
}
</style>
</head>
<body>
<div class="sync-bar offline" id="sync-bar">
  <div class="sync-dot"></div>

// ── HELPERS ───────────────────────────────────────────────
function ownerOf(team){ return PARTICIPANTS.filter(p=>(PRESET_TEAMS[p]||[]).includes(team)); }

function getForm(team,n=3){
  return allGroupMatches.filter(m=>(m.home===team||m.away===team)).map(m=>{
    const sc=scores[m.home+'_'+m.away];
    if(!sc||sc.hs==null||sc.as==null) return null;
    const h=+sc.hs,a=+sc.as; if(isNaN(h)||isNaN(a)) return null;
    if(m.home===team) return h>a?'W':h<a?'L':'D';
    else return a>h?'W':a<h?'L':'D';
  }).filter(Boolean).slice(-n);
}

function formDotsHtml(team){
  const form=getForm(team,3);
  if(!form.length) return '';
  return '<span class="form-dots">'+form.map(r=>`<span class="form-dot form-${r.toLowerCase()}"></span>`).join('')+'</span>';
}

function getStandings(gid){
  const tbl={};
  GROUPS[gid].forEach(t=>tbl[t]={p:0,w:0,d:0,l:0,gf:0,ga:0,pts:0});
  allGroupMatches.filter(m=>m.g===gid).forEach(m=>{
    const sc=scores[m.home+'_'+m.away];
    if(!sc||sc.hs==null||sc.as==null) return;
    const h=+sc.hs,a=+sc.as; if(isNaN(h)||isNaN(a)) return;
    tbl[m.home].p++;tbl[m.away].p++;
    tbl[m.home].gf+=h;tbl[m.home].ga+=a;tbl[m.away].gf+=a;tbl[m.away].ga+=h;
    if(h>a){tbl[m.home].w++;tbl[m.home].pts+=3;tbl[m.away].l++;}
    else if(h<a){tbl[m.away].w++;tbl[m.away].pts+=3;tbl[m.home].l++;}
    else{tbl[m.home].d++;tbl[m.away].d++;tbl[m.home].pts++;tbl[m.away].pts++;}
  });
  return Object.entries(tbl).map(([name,s])=>({name,...s,gd:s.gf-s.ga}))
    .sort((a,b)=>b.pts-a.pts||b.gd-a.gd||b.gf-a.gf||a.name.localeCompare(b.name));
}

function groupComplete(gid){
  return allGroupMatches.filter(m=>m.g===gid).every(m=>{
    const sc=scores[m.home+'_'+m.away];
    return sc&&sc.hs!=null&&sc.as!=null&&!isNaN(+sc.hs)&&!isNaN(+sc.as);
  });
}

function getTeamGroupPts(team){
  const gid=Object.keys(GROUPS).find(g=>GROUPS[g].includes(team));
  if(!gid) return 0;
  return (getStandings(gid).find(s=>s.name===team)||{pts:0}).pts;
}
function getTeamGroupGoals(team){
  const gid=Object.keys(GROUPS).find(g=>GROUPS[g].includes(team));
  if(!gid) return 0;
  return (getStandings(gid).find(s=>s.name===team)||{gf:0}).gf;
}
function getTeamKoPts(team){
  let pts=0;
  KO_ROUNDS.forEach(round=>{
    for(let i=0;i<round.matches;i++){
      const m=koMatches[round.id+'_'+i];
      if(!m||m.hs==null||m.as==null) continue;
      const h=+m.hs,a=+m.as; if(isNaN(h)||isNaN(a)) continue;
      const winner=(h>a)?m.home:(a>h)?m.away:m.winner||null;
      if(winner===team){ pts+=round.pts; if(round.id==='final') pts+=KO_PTS.winner; }
    }
  });
  return pts;
}
function getPlayerScore(name){
  const teams=PRESET_TEAMS[name]||[];
  let groupPts=0,koPts=0,goals=0,qualified=0,koWins=0;
  teams.forEach(team=>{
    groupPts+=getTeamGroupPts(team);
    goals+=getTeamGroupGoals(team);
    koPts+=getTeamKoPts(team);
    const inKO=KO_ROUNDS.some(r=>{for(let i=0;i<r.matches;i++){const m=koMatches[r.id+'_'+i];if(m&&(m.home===team||m.away===team))return true;}return false;});
    if(inKO) qualified++;
    KO_ROUNDS.forEach(r=>{
      for(let i=0;i<r.matches;i++){
        const m=koMatches[r.id+'_'+i];
        if(!m||m.hs==null||m.as==null) continue;
        const h=+m.hs,a=+m.as; if(isNaN(h)||isNaN(a)) continue;
        const winner=(h>a)?m.home:(a>h)?m.away:m.winner||null;
        if(winner===team) koWins++;
      }
    });
  });
  return {groupPts,koPts,total:groupPts+koPts,goals,qualified,koWins};
}

function getQualifiedTeams(){
  const q=[];
  Object.keys(GROUPS).forEach(gid=>{
    const st=getStandings(gid);
    if(groupComplete(gid)) q.push(st[0].name,st[1].name);
    else GROUPS[gid].forEach(t=>q.push(t));
  });
  return [...new Set(q)].sort();
}

function tierOf(t){ for(const [n,ts] of Object.entries(TIERS)) if(ts.includes(t)) return +n; return 0; }

function goalscorerRow(key){
  const gs=goalscorers[key];
  if(!gs||(!gs.home?.length&&!gs.away?.length)) return '';
  const hl=(gs.home||[]).join(' · ');
  const al=(gs.away||[]).join(' · ');
  return `<div style="display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:4px 14px 8px;background:var(--surface2);border:2px solid var(--border);border-top:none;border-radius:0 0 var(--radius) var(--radius);font-size:11px;color:var(--muted);font-weight:600"><div style="text-align:right">${hl}</div><div>${al}</div></div>`;
}

function updateTicker(){
  const liveItems = [];
  const resultItems = [];

  allGroupMatches.forEach(m=>{
    const sc=scores[m.home+'_'+m.away];
    if(!sc||sc.hs==null||sc.as==null) return;
    const ho=ownerOf(m.home).join(', ');
    const ao=ownerOf(m.away).join(', ');
    const item={home:m.home,away:m.away,hs:sc.hs,as:sc.as,ho,ao};
    if(sc.live) liveItems.push(item);
    else resultItems.push(item);
  });
  KO_ROUNDS.forEach(r=>{
    for(let i=0;i<r.matches;i++){
      const m=koMatches[r.id+'_'+i];
      if(!m||!m.home||!m.away||m.hs==null||m.as==null) continue;
      resultItems.push({home:m.home,away:m.away,hs:m.hs,as:m.as,ho:ownerOf(m.home).join(', '),ao:ownerOf(m.away).join(', '),round:r.label});
    }
  });

  const ticker=document.getElementById('live-ticker');
  const track=document.getElementById('ticker-track');
  const label=document.querySelector('.ticker-label');
  const allItems=[...liveItems,...resultItems];
  if(!allItems.length){ ticker.classList.remove('active'); return; }

  const isLive=liveItems.length>0;
  ticker.classList.add('active');
  if(isLive){
    ticker.style.background='#c1121f';
    label.innerHTML='<div class="ticker-dot"></div>LIVE';
  } else {
    ticker.style.background='#2d6a4f';
    label.innerHTML='RESULTS';
  }

  const doubled=[...allItems,...allItems];
  track.innerHTML=doubled.map(it=>`<div class="ticker-item">${flag(it.home)} ${it.home} <span class="ticker-score">${it.hs}–${it.as}</span> ${it.away} ${flag(it.away)}${(it.ho||it.ao)?` <span class="ticker-owners">(${it.ho||'?'} vs ${it.ao||'?'})</span>`:''}</div>`).join('');
}

// ── BRACKET ───────────────────────────────────────────────
function renderBracket(){
  const rounds=[
    {id:'r32',label:'R32',matches:16},{id:'r16',label:'R16',matches:8},
    {id:'qf',label:'QF',matches:4},{id:'sf',label:'SF',matches:2},
    {id:'final',label:'Final',matches:1}
  ];
  let html='<div class="bracket-wrap"><div class="bracket">';
  rounds.forEach(round=>{
    html+=`<div class="bracket-round"><div class="bracket-round-label">${round.label}</div>`;
    const spacing=16/round.matches;
    for(let i=0;i<round.matches;i++){
      if(i>0) html+=`<div style="flex:${spacing-1}"></div>`;
      else html+=`<div style="flex:${(spacing-1)/2}"></div>`;
      const key=round.id+'_'+i;
      const m=koMatches[key]||{};
      const has=m.home&&m.away&&m.hs!=null&&m.as!=null&&!isNaN(+m.hs)&&!isNaN(+m.as);
      const winner=has?(+m.hs>+m.as?m.home:+m.as>+m.hs?m.away:m.winner||null):null;
      const tRow=(team,score)=>{
        if(!team) return `<div class="bracket-team tbd"><div class="bracket-team-left"><span>TBD</span></div></div>`;
        const owners=ownerOf(team);
        return `<div class="bracket-team ${winner===team?'winner':''}"><div class="bracket-team-left">${flag(team)}<span>${team}</span></div>${owners.length?`<span class="bracket-owner">${owners[0]}</span>`:''}<span class="bracket-score">${score!=null?score:''}</span></div>`;
      };
      html+=`<div class="bracket-match">${tRow(m.home||null,has?m.hs:null)}${tRow(m.away||null,has?m.as:null)}</div>`;
    }
    html+=`<div style="flex:${(spacing-1)/2}"></div></div>`;
  });
  html+='</div></div>';
  return html;
}

// ── IN / OUT ──────────────────────────────────────────────
function renderQualified(){
  const inT=[],outT=[],tbdT=[];
  Object.keys(GROUPS).forEach(gid=>{
    const st=getStandings(gid);const done=groupComplete(gid);
    st.forEach((t,i)=>{ if(!done) tbdT.push({name:t.name,gid,rank:i+1}); else if(i<2) inT.push({name:t.name,gid,rank:i+1}); else outT.push({name:t.name,gid,rank:i+1}); });
  });
  const total=Object.keys(GROUPS).length;
  const done=Object.keys(GROUPS).filter(g=>groupComplete(g)).length;
  const pct=Math.round(done/total*100);
  let html=`<div style="margin-bottom:18px"><div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:6px"><span style="font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.1em;color:var(--muted)">Groups progress</span><span style="font-size:12px;font-weight:800;color:var(--green)">${done}/${total} complete</span></div><div class="progress-bar-wrap"><div class="progress-bar-fill" style="width:${pct}%"></div></div></div>`;
  if(!inT.length&&!outT.length){
    html+=`<div class="waiting-state"><img class="waiting-gif" src="https://media.giphy.com/media/l0HlBO7eyXzSZkJri/giphy.gif" onerror="this.style.display='none'" alt=""><div class="waiting-title">Nothing to see here... yet!</div><div class="waiting-sub">Waiting for scores to be entered!</div></div>`;

    const sad=['&#128557;','&#128128;','&#129312;','&#128553;','&#129686;','&#128544;','&#129318;','&#128556;'];

    if(!inT.length) html+='<div class="empty" style="padding:16px">None yet</div>';

    html+=`</div></div><div class="qualified-panel"><div class="qp-header out-header"><span class="qp-emoji">&#9992;&#65039;</span><span class="qp-title">Going Home</span><span class="qp-count">${outT.length}</span></div><div class="qp-list">`;
    if(!outT.length) html+='<div class="empty" style="padding:16px">None yet</div>';
    else outT.forEach((t,i)=>{html+=`<div class="qp-item">${flag(t.name)}<span>${t.name}</span><span style="margin-left:4px">${sad[i%sad.length]}</span><span class="group-tag">Grp ${t.gid}</span></div>`;});
    html+='</div></div></div>';
    if(tbdT.length){
      html+='<div style="margin-top:16px"><div style="font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.12em;margin-bottom:8px;font-weight:800">Still playing</div><div style="display:flex;flex-wrap:wrap;gap:6px">';
      tbdT.forEach(t=>{html+=`<div style="padding:4px 10px;background:var(--surface);border:2px solid var(--border);border-radius:50px;font-size:11px;font-weight:700;color:var(--muted);display:flex;align-items:center;gap:4px">${flag(t.name)} ${t.name}</div>`;});
      html+='</div></div>';
    }
  }
  document.getElementById('panel-qualified').innerHTML=html;
}

// ── STATS ─────────────────────────────────────────────────
window.setStatsView=v=>{statsView=v;renderStats();};

function statTable(title,emoji,rows,c1l,c1k,c2l,c2k){
  let html=`<div style="margin-bottom:20px"><div style="font-family:'Abril Fatface',serif;font-size:20px;color:var(--green);margin-bottom:8px;padding-bottom:6px;border-bottom:2px solid var(--border)">${emoji} ${title}</div><div style="background:var(--surface);border:2px solid var(--border);border-radius:var(--radius-lg);overflow:hidden;box-shadow:var(--shadow)"><div style="display:grid;grid-template-columns:32px 1fr 60px ${c2k?'60px':''};gap:6px;padding:7px 12px;background:var(--green);font-size:10px;font-weight:800;color:rgba(255,255,255,.7);text-transform:uppercase;letter-spacing:.08em"><div></div><div>Team</div><div style="text-align:center">${c1l}</div>${c2k?`<div style="text-align:center">${c2l}</div>`:''}</div>`;
  rows.forEach((r,i)=>{
    const medal=i===0?'1st':i===1?'2nd':i===2?'3rd':'';
    html+=`<div style="display:grid;grid-template-columns:32px 1fr 60px ${c2k?'60px':''};gap:6px;padding:9px 12px;border-bottom:1px solid var(--border);align-items:center;${i===0?'background:var(--gold-light)':''}"><div style="font-family:'Abril Fatface',serif;font-size:16px;color:var(--muted);text-align:center">${medal||i+1}</div><div style="font-weight:700;font-size:13px;display:flex;align-items:center;gap:5px">${flag(r.name)} ${r.name}</div><div style="text-align:center;font-family:'Abril Fatface',serif;font-size:18px;color:var(--green)">${r[c1k]}</div>${c2k?`<div style="text-align:center;font-size:13px;font-weight:700;color:var(--muted)">${r[c2k]}</div>`:''}</div>`;
  });
  html+='</div></div>';
  return html;
}

function playerStatTable(title,emoji,rows,c1l,c1k,c2l,c2k){
  let html=`<div style="margin-bottom:20px"><div style="font-family:'Abril Fatface',serif;font-size:20px;color:var(--green);margin-bottom:8px;padding-bottom:6px;border-bottom:2px solid var(--border)">${emoji} ${title}</div><div style="background:var(--surface);border:2px solid var(--border);border-radius:var(--radius-lg);overflow:hidden;box-shadow:var(--shadow)"><div style="display:grid;grid-template-columns:32px 1fr 60px ${c2k?'60px':''};gap:6px;padding:7px 12px;background:var(--green);font-size:10px;font-weight:800;color:rgba(255,255,255,.7);text-transform:uppercase;letter-spacing:.08em"><div></div><div>Player</div><div style="text-align:center">${c1l}</div>${c2k?`<div style="text-align:center">${c2l}</div>`:''}</div>`;
  rows.forEach((p,i)=>{
    const medal=i===0?'1st':i===1?'2nd':i===2?'3rd':'';
    html+=`<div style="display:grid;grid-template-columns:32px 1fr 60px ${c2k?'60px':''};gap:6px;padding:9px 12px;border-bottom:1px solid var(--border);align-items:center;${i===0?'background:var(--gold-light)':''}"><div style="font-family:'Abril Fatface',serif;font-size:16px;color:var(--muted);text-align:center">${medal||i+1}</div><div><div style="font-weight:700;font-size:12px">${p.name}</div><div style="font-size:10px;color:var(--muted);display:flex;align-items:center;gap:3px">${flag(p.team)} ${p.team}</div></div><div style="text-align:center;font-family:'Abril Fatface',serif;font-size:18px;color:var(--green)">${p[c1k]}</div>${c2k?`<div style="text-align:center;font-size:13px;font-weight:700;color:var(--muted)">${p[c2k]}</div>`:''}</div>`;
  });
  html+='</div></div>';
  return html;
}

function renderStats(){
  const el=document.getElementById('panel-stats');
  let html=`<div class="toggle-bar"><button class="toggle-btn ${statsView==='teams'?'active':''}" onclick="setStatsView('teams')">Teams</button><button class="toggle-btn ${statsView==='players'?'active':''}" onclick="setStatsView('players')">Players</button></div>`;
  if(statsView==='teams'){
    const ts=Array.isArray(teamStats)?teamStats:Object.values(teamStats);
    if(!ts.length&&!Object.keys(teamCards).length){
      html+='<div class="empty"><div class="empty-icon">&#128202;</div>No data yet.</div>';
    } else {
      const byGF=[...ts].sort((a,b)=>b.goalsFor-a.goalsFor).slice(0,5);
      const byGA=[...ts].filter(t=>t.played>0).sort((a,b)=>a.goalsAgainst-b.goalsAgainst).slice(0,5);
      const wc=Object.entries(teamCards).map(([name,c])=>({name,...c}));
      html+=statTable('Most Goals Scored','&#9917;',byGF,'Goals','goalsFor','Played','played');
      html+=statTable('Best Defence','&#128737;',byGA,'Conceded','goalsAgainst','Played','played');
      html+=statTable('Most Yellow Cards','&#129000;',wc.sort((a,b)=>b.yellows-a.yellows).slice(0,5),'Yellows','yellows','Reds','reds');
      if(wc.some(r=>r.reds>0)) html+=statTable('Most Red Cards','&#128997;',wc.sort((a,b)=>b.reds-a.reds).slice(0,5),'Reds','reds','Yellows','yellows');
    }
  } else {
    const ts=Array.isArray(topScorers)?topScorers:Object.values(topScorers);
    const ta=Array.isArray(topAssists)?topAssists:Object.values(topAssists);
    const ty=Array.isArray(topYellows)?topYellows:Object.values(topYellows);
    const tr=Array.isArray(topReds)?topReds:Object.values(topReds);
    if(!ta.length&&!ty.length){
      html+='<div class="empty"><div class="empty-icon">&#128100;</div>No data yet.</div>';
    } else {
      html+=playerStatTable('Top Assists','&#127919;',ta.slice(0,5),'Assists','assists','Games','games');
      html+=playerStatTable('Most Shots','&#127919;',[...ts].sort((a,b)=>b.shots-a.shots).slice(0,5),'Shots','shots','Goals','goals');
      html+=playerStatTable('Most Dribbles','&#127939;',[...ts].sort((a,b)=>b.dribbles-a.dribbles).slice(0,5),'Dribbles','dribbles','Goals','goals');
      html+=playerStatTable('Most Yellow Cards','&#129000;',ty.slice(0,5),'Yellows','yellows','Reds','reds');
      if(tr.some(p=>p.reds>0)) html+=playerStatTable('Most Red Cards','&#128997;',tr.filter(p=>p.reds>0).slice(0,5),'Reds','reds','Yellows','yellows');
    }
  }
  el.innerHTML=html;
}

window.resetScores=()=>{ if(!isAdmin) return; if(!confirm('Reset all group scores?')) return; scores={}; saveScores(); };

function refreshPanel(){
  if(currentPanel==='sweepstake')   renderSweepstake();
  else if(currentPanel==='leaderboard')  renderLeaderboard();
  else if(currentPanel==='golden-boot')  renderGoldenBoot();
  else if(currentPanel==='group-stage')  renderGroupStage();
  else if(currentPanel==='knockouts')    renderKnockouts();
  else if(currentPanel==='qualified')    renderQualified();
  else if(currentPanel==='stats')        renderStats();
}

window.showPanel=(name,tab)=>{
  currentPanel=name;
  document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));
  document.querySelectorAll('.nav-tab').forEach(t=>t.classList.remove('active'));
  document.getElementById('panel-'+name).classList.add('active');
  if(tab) tab.classList.add('active');
  else{ const idx={sweepstake:0,leaderboard:1,'golden-boot':2,'group-stage':3,knockouts:4,qualified:5,stats:6}[name]; document.querySelectorAll('.nav-tab')[idx].classList.add('active'); }
  refreshPanel();
};

renderHeroStats();
renderSweepstake();
</script>
